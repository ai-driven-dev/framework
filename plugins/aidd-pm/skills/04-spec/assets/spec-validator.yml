# Checklist a spec is validated against. Each criterion is scored on its own.

criteria:
  - id: target
    description: One sentence, unambiguous and verifiable, naming a single target.
    required: true
    weight: 25

  - id: hard_constraints
    description: Non-negotiable constraints, each concrete and testable.
    required: true
    weight: 20

  - id: non_goals
    description: Out-of-scope items listed, so a reader knows what not to build.
    required: true
    weight: 20

  - id: done_when
    description: Completion conditions, each an observable outcome, never a command.
    required: true
    weight: 25

  - id: open_questions
    description: Every gap listed once in the open questions section as a precise question, or None. A gap is an unresolved decision a required section depends on. A listed gap is valid; a marker written in any other section is not.
    required: true
    weight: 0

  - id: stakeholders
    description: Decider, owner and consumer named.
    required: false
    weight: 5

  - id: context
    description: Background or links a downstream decision needs.
    required: false
    weight: 5

hard_thresholds:
  any_required_unfulfilled: invalid
  target_unclear_or_multiple_targets: invalid
  done_when_unverifiable: invalid
  contains_implementation_details: invalid
  open_questions_outside_their_section: invalid

scoring:
  pass_threshold: 90
  notes: Valid when every required criterion is fulfilled and the weighted score reaches pass_threshold. A hard threshold forces invalid whatever the score.
