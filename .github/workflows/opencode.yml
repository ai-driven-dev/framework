name: OpenCode agent

# Lets the repository owner hand work to OpenCode from a comment starting with `/opencode`, on an
# issue, a pull request, or a line-level review. On a pull request the agent's changes land on
# its branch; on an issue they land on a new branch with a pull request to the configured
# base branch. The agent's reply is posted back as a comment.
#
# Only the account configured by numeric ID can trigger it. The repository is public, so
# any comment would otherwise spend the subscription and feed untrusted text to an agent.
#
# OpenCode v2 has no GitHub integration of its own, so this workflow follows the documented CI
# recipe (`opencode run --standalone` with the key as a secret) and commits, pushes and replies
# itself. The agent step holds no GitHub credential.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

# No default grant: a job added later starts with nothing.
permissions: {}

jobs:
  opencode:
    name: Run OpenCode
    if: vars.OPENCODE_REVIEWER_ID != '' && format('{0}', github.event.comment.user.id) == vars.OPENCODE_REVIEWER_ID && startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_BRANCH: ${{ vars.OPENCODE_BASE_BRANCH || github.event.repository.default_branch }}
    steps:
      - name: Validate the authorized user ID
        env:
          OPENCODE_REVIEWER_ID: ${{ vars.OPENCODE_REVIEWER_ID }}
        run: |
          id=$OPENCODE_REVIEWER_ID
          [[ $id =~ ^[1-9][0-9]*$ ]] &&
            { (( ${#id} < 16 )) || { (( ${#id} == 16 )) && [[ $id < 9007199254740992 ]]; }; } || {
              echo '::error::OPENCODE_REVIEWER_ID must be a positive, exactly representable GitHub user ID.'
              exit 1
            }
      # The image must come from the default branch, never the PR being edited.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .aidd-runtime
          sparse-checkout: |
            docker/aidd-opencode
            scripts/pr-review
            .claude/skills
            .agents/skills
            .opencode/skills
          persist-credentials: false

      - name: Resolve the branch to work on
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .aidd-runtime/scripts/pr-review/conversation-target.sh

      # A PR-controlled symlink could point outside /work, including to the
      # model credential in /proc. Check out links as plain text instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.symlinks
          GIT_CONFIG_VALUE_0: 'false'
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: project
          fetch-depth: 1
          persist-credentials: false

      # Keep Git from treating those plain-text links as type changes later.
      - run: git -C project config core.symlinks false

      - name: Install the project's AIDD runtime
        env:
          AIDD_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/aidd-project"
          bash .aidd-runtime/scripts/pr-review/setup-project.sh project "$RUNNER_TEMP/aidd-project"
          mkdir -p "$RUNNER_TEMP/aidd-project/.opencode/skills" "$RUNNER_TEMP/aidd-project/.opencode/agents"

      - name: Write the prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .aidd-runtime/scripts/pr-review/conversation-prompt.sh

      - name: Build the trusted AIDD image
        run: docker build -t aidd-opencode:local .aidd-runtime/docker/aidd-opencode

      # --auto approves whatever is not denied, so nothing waits on a prompt nobody can answer.
      - name: Run OpenCode
        id: agent
        env:
          MODEL: ${{ vars.OPENCODE_AGENT_MODEL || 'opencode-go/beam-free' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          # Load the isolated AIDD installation, but not the PR's executable configuration.
          docker run --rm -i \
            -e OPENCODE_API_KEY -e OPENCODE_DISABLE_PROJECT_CONFIG=1 \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -v "$GITHUB_WORKSPACE/project:/work" \
            -v "$GITHUB_WORKSPACE/.aidd-runtime:/trusted:ro" \
            -v "$RUNNER_TEMP/aidd-project/.opencode/skills:/root/.config/opencode/skills:ro" \
            -v "$RUNNER_TEMP/aidd-project/.opencode/agents:/root/.config/opencode/agents:ro" \
            -v "$GITHUB_WORKSPACE/.aidd-runtime/scripts/pr-review/conversation-policy.json:/etc/opencode/opencode.json:ro" \
            -w /work aidd-opencode:local \
            run --standalone --auto --model "$MODEL" \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/reply.md"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: ${{ !cancelled() && steps.target.outcome == 'success' }}
        with:
          app-id: ${{ secrets.AIDD_BOT_APP_ID }}
          private-key: ${{ secrets.AIDD_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # Pushed with the bot's token rather than GITHUB_TOKEN so the pushed commits trigger CI.
      - name: Push the changes and reply
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        working-directory: project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash "$GITHUB_WORKSPACE/.aidd-runtime/scripts/pr-review/conversation-reply.sh"
