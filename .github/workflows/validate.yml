name: Validate

# Runs the pre-commit hooks against the full tree on every push and pull request, so work
# that bypassed lefthook locally is gated by the same logic. Framework content is checked
# once, by the step after the hooks: `framework-content` is excluded from the hooks run because
# it writes with --fix. One job, so the required check `lefthook (framework-local checks)` covers it. The CLI-coupled generator hook `git add`s what it regenerates instead of
# failing on drift, so a step below re-checks against HEAD.

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

permissions:
  contents: read

jobs:
  opencode-review:
    name: OpenCode review tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          bash scripts/__tests__/pr-review/test-review.sh
          bash scripts/__tests__/pr-review/test-setup-project.sh
          bash scripts/__tests__/pr-review/test-conversation-branches.sh
      - name: Build and smoke-test both images
        run: |
          docker build -t aidd-opencode:local docker/aidd-opencode
          docker build -f docker/aidd-opencode/runner/Dockerfile -t aidd-review-runner:ci .
          docker run --rm --user reviewer -e HOME=/home/aidd --entrypoint sh aidd-review-runner:ci -c '
            opencode --version && node --version && jq --version && test -x /opt/aidd/run-review
          '
          docker run --rm --entrypoint sh aidd-review-runner:ci -c '
            cd /home/runner/actions-runner
            umask 022; touch .runner .credentials .credentials_rsaparams
            /opt/aidd/runner >/dev/null 2>&1 || :
            for file in .runner .credentials .credentials_rsaparams; do
              test "$(stat -c %a "$file")" = 600 || exit 1
            done
          '
      - run: bash scripts/__tests__/pr-review/test-runner.sh

  lefthook:
    name: lefthook (framework-local checks)
    runs-on: ubuntu-latest
    env:
      LEFTHOOK_CHILD: "1"
      CI: "true"
      # cli-ci.yml owns these three unconditionally, so running them again buys no coverage.
      # cli-type-honesty is deliberately NOT excluded: no cli-ci.yml job runs it, making this
      # its only CI coverage. Recipe validation builds the CLI and needs its separate install.
      # framework-content runs in its own step below, without --fix.
      LEFTHOOK_EXCLUDE: "cli-biome,cli-architecture,cli-typecheck,framework-content"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'cli/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --dir cli install --frozen-lockfile --ignore-scripts

      # Fails on a finding absent from the baseline in scripts/check/baseline.json, on an engine copy that drifted, or on a stale generated file (no --fix: nothing is written).
      - name: Check framework content
        run: node scripts/check/run.cjs

      - name: Run pre-commit hooks against the full tree
        run: pnpm exec lefthook run pre-commit --all-files --force

      # The generator hook `git add`s its output and never fails on drift, so a stale tool
      # list or COMPATIBILITY.md passes the step above in silence. Against HEAD, not the
      # index: the generator already staged, so a plain `git diff` is empty.
      - name: Fail if a CLI-coupled generated file drifted from what pre-commit regenerated
        run: |
          if ! git diff --exit-code HEAD -- README.md docs/COMPATIBILITY.md; then
            echo "::error::A generated file is stale. Run 'pnpm exec lefthook run pre-commit --all-files --force' locally and commit the result."
            exit 1
          fi
