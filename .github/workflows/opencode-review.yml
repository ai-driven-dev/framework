name: OpenCode review after Alex's review

on:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

jobs:
  discover:
    # Explicit cutoff avoids reviewing historical submissions on first deployment.
    if: vars.OPENCODE_REVIEW_ENABLED_AT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      has_candidates: ${{ steps.find.outputs.has_candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: lts/*
      - name: Find Alex's submitted reviews
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_REVIEW_ENABLED_AT: ${{ vars.OPENCODE_REVIEW_ENABLED_AT }}
        run: node scripts/opencode-review/discover.mjs

  review:
    needs: discover
    if: needs.discover.outputs.has_candidates == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: opencode-review-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: write
    env:
      REVIEW_NUMBER: ${{ matrix.number }}
      REVIEW_ID: ${{ matrix.reviewId }}
      OPENCODE_REVIEW_ENABLED_AT: ${{ vars.OPENCODE_REVIEW_ENABLED_AT }}
    steps:
      - name: Checkout trusted base
        timeout-minutes: 3
        id: base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout reviewed head
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.head }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 3
        with:
          node-version: lts/*
      - name: Verify the submitted review
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/opencode-review/ci.mjs event
      - name: Select changed files
        timeout-minutes: 3
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/opencode-review/ci.mjs prepare
      - name: Prepare isolated review context
        timeout-minutes: 3
        if: steps.selection.outputs.review == 'true'
        run: bash trusted/scripts/opencode-review/prepare.sh
      - name: Install OpenCode
        timeout-minutes: 3
        if: steps.selection.outputs.review == 'true'
        run: npm install --global @opencode/cli@2.2.2
      - name: Review selected files
        timeout-minutes: 12
        if: steps.selection.outputs.review == 'true'
        working-directory: ${{ runner.temp }}/opencode-review
        env:
          OPENCODE_PURE: '1'
        run: bash "$GITHUB_WORKSPACE/trusted/scripts/opencode-review/review.sh"
      - name: Publish verified review
        timeout-minutes: 2
        if: steps.selection.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/opencode-review/ci.mjs publish
      - name: Record failure once
        timeout-minutes: 2
        if: failure() && steps.base.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/opencode-review/ci.mjs failure
