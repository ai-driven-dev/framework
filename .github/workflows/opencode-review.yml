name: AIDD review

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: aidd-opencode-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on:
      group: aidd-opencode-review
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Scheduled runs and allowed manual runs execute trusted default-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.AIDD_BOT_APP_ID }}
          private-key: ${{ secrets.AIDD_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Review new submissions
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REVIEW_TOKEN: ${{ github.token }}
          REVIEW_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          REVIEW_MODEL_RUNNER: /opt/aidd/run-review
          AIDD_REVIEW_ENABLED_AT: ${{ vars.AIDD_REVIEW_ENABLED_AT }}
          OPENCODE_REVIEWER_ID: ${{ vars.OPENCODE_REVIEWER_ID }}
          OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'openai/gpt-6.1-terra#medium' }}
        run: bash scripts/pr-review/discover.sh
