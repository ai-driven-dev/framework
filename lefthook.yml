pre-commit:
  output: true
  commands:
    framework-content:
      # The one content check: contracts and generated docs. --fix regenerates. stage_fixed
      # re-stages only the staged files, so the generated outputs --fix rewrote are added by name,
      # never one that already held an unstaged edit.
      # Given no staged file lefthook skips it; CI runs the full check itself.
      run: |
        before=$(mktemp)
        git diff --name-only -- README.md docs/CATALOG.md 'plugins/*/CATALOG.md' > $before
        node scripts/check/run.cjs --fix {staged_files} || exit 1
        git diff --name-only -- README.md docs/CATALOG.md 'plugins/*/CATALOG.md' | grep -vxFf $before | xargs git add --
        rm $before
      stage_fixed: true
    yaml-validity:
      glob: "**/*.{yml,yaml}"
      exclude:
        - "plugins/*/skills/*/assets/**"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo '❌ node not available; cannot validate YAML'
          exit 1
        fi
        node scripts/validate-yaml.mjs {files}
    scripts-tests:
      glob:
        - "scripts/**/*.{js,cjs,mjs}"
        - "plugins/**/*.{js,cjs,mjs}"
        - "cli/src/**/*.{js,cjs,mjs}"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo 'ℹ️  node not available; skipping scripts-tests'
          exit 0
        fi
        # `node --test <dir>` fails on a directory, so a glob is required — and a glob
        # matching nothing exits 0 in silence, so a renamed folder must be caught by a count.
        found=$(ls scripts/__tests__/*.test.js 2>/dev/null | wc -l | tr -d ' ')
        if [ $found -eq 0 ]; then
          echo '❌ no test files under scripts/__tests__/; the runner is not wired'
          exit 1
        fi
        # Wrapped: a suite writing into this repository's own .git/hooks passes every
        # assertion and destroys an install nothing can restore — `.git` is in no history.
        node scripts/check-tests-leave-git-alone.js -- \
          node --test 'scripts/__tests__/**/*.test.js'
    architecture-rules:
      # Router coherence for a skill with no flowchart, until no SKILL-06 no-flowchart finding is baselined.
      glob: "plugins/*/skills/*/SKILL.md"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo 'ℹ️  node not available; skipping architecture-rules'
          exit 0
        fi
        node scripts/check-architecture-rules.js {files}
    sync-generated-docs:
      # Reads the CLI's tool-support record, so it stays outside run.cjs.
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo 'ℹ️  node not available; skipping sync-generated-docs'
          exit 0
        fi
        before=$(mktemp)
        git diff --name-only -- README.md docs/COMPATIBILITY.md > $before
        node scripts/sync-generated-docs.mjs >/dev/null
        git diff --name-only -- README.md docs/COMPATIBILITY.md | grep -vxFf $before | xargs git add --
        rm $before
    cli-biome:
      glob: "cli/**"
      run: cd cli && pnpm lint
    cli-architecture:
      # The suite reads source as text only, and reads well beyond cli/src: narrower globs
      # kept going stale, so this one is the whole surface plus the automation files.
      glob: "{cli/**,lefthook.yml,.github/workflows/**}"
      run: cd cli && pnpm test:arch
    cli-typecheck:
      glob: "cli/**"
      run: cd cli && pnpm typecheck
    cli-type-honesty:
      # Type honesty only; dependency direction between layers belongs to biome
      # (cli/biome.json's noRestrictedImports overrides), not here.
      glob: "{cli/src/**,cli/tests/**,cli/type-assertions-baseline.json}"
      run: |
        if ! command -v node >/dev/null 2>&1; then
          echo 'ℹ️  node not available; skipping cli-type-honesty'
          exit 0
        fi
        node scripts/check-cli-type-honesty.mjs

pre-push:
  commands:
    cli-knip:
      glob: "cli/**"
      run: node scripts/gate-witness.js cli-knip -- pnpm --dir cli knip
    cli-knip-production:
      glob: "cli/**"
      run: node scripts/gate-witness.js cli-knip-production -- pnpm --dir cli knip:production
    cli-jscpd:
      glob: "cli/**"
      run: node scripts/gate-witness.js cli-jscpd -- pnpm --dir cli jscpd
    cli-jscpd-profiles:
      glob: "cli/**"
      run: node scripts/gate-witness.js cli-jscpd-profiles -- pnpm --dir cli jscpd:profiles
    # The architecture project runs in pre-commit and in `cli-ci.yml`'s cli-architecture: the
    # full suite is not replayed here.
    cli-test:
      glob: "cli/**"
      run: >-
        node scripts/gate-witness.js cli-test --
        pnpm --dir cli exec vitest run --project=!tooling --project=!architecture

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
